name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.24-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          apk add --no-cache git make bash gcc musl-dev golangci-lint

      - name: Verify code
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test

  docker-build-push:
    name: Build and push Docker image
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Google Container Registry
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCR_SERVICE_ACCOUNT_KEY }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bhambins:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bhambins:${{ github.sha }}
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/bhambins:latest
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/bhambins:${{ github.sha }}
